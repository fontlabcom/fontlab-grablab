# this_file: src_docs/mkdocs.yml
site_name: GrabLab
site_description: 'GrabLab: public contracts, installation and runtime boundaries.'
site_url: https://fontlabcom.github.io/fontlab-grablab/
repo_url: https://github.com/fontlabcom/fontlab-grablab
repo_name: fontlabcom/fontlab-grablab
docs_dir: md
site_dir: ../docs
use_directory_urls: true
theme:
  name: fly-january
  language: en
  palette:
    scheme: default
  features:
    - search.highlight
    - content.code.copy
plugins:
  - fly
  - search:
      lang: [en]
markdown_extensions:
  - admonition
  - tables
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - Index: index.md
  - Installation: installation.md
  - Capture Bundles: capture-bundles.md
  - Svg And Icons: svg-and-icons.md
  - Development And Limits: development-and-limits.md
  - Licence: licence.md
extra:
  fly:
    chrome: fontlab
    chrome_options:
      site-label: GrabLab
hooks:
  - english_search.py
